<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Now Playing — Vinyl (cartoon premium)</title>
<style>
  :root{
    --bg-top:#2a2440; --bg-bot:#0f0c1c;
    --deck:#7a4a2b; --deck-dark:#4b2c19; --deck-hi:#9a6238; --deck-edge:#2a160a;
    --platter-well:#1a1620; --platter-rim:#3a3340;
    --disc:#141018; --disc-hi:#2c2833;
    --cream:#f6efe2; --accent:#ffb454; --accent-2:#ff6d8f; --metal:#e9e2d4;
    /* dot-matrix LED display */
    --led:#ffc775; --led-glow:rgba(255,150,50,.6); --led-off:rgba(255,192,97,.09);
    --panel:#0a0806;
    --dot:0.2vw;                       /* LED pixel pitch */
  }
  html,body{margin:0;height:100%;overflow:hidden;background:#0f0c1c;font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;}
  #stage{position:fixed;inset:0;display:grid;place-items:center;
    background:radial-gradient(120% 105% at 50% 44%, var(--bg-top), var(--bg-bot) 80%);
    perspective:2400px;}
  .glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.4;pointer-events:none;}
  .glow.a{width:52vw;height:52vw;left:-14vw;top:-16vw;background:var(--bg-top);opacity:.42;}
  .glow.b{width:44vw;height:44vw;right:-8vw;bottom:-16vw;background:var(--accent-2);opacity:.30;}

  /* stage — wider, text aside the deck (scaled to 0.9 of the available area) */
  .stage-row{position:relative;display:flex;align-items:center;gap:4vw;
    width:min(86vw,162vh);transform:rotateX(4deg) scale(.9);transform-origin:center;}

  /* ============================================================
     DECK — wide slab on the left
     ============================================================ */
  .deck{position:relative;flex:1.55;aspect-ratio:1/0.78;border-radius:28px;
    background:
      radial-gradient(130% 120% at 22% 8%, var(--deck-hi), rgba(0,0,0,0) 55%),
      linear-gradient(158deg, var(--deck), var(--deck-dark));
    box-shadow:
      0 60px 120px -28px rgba(0,0,0,.78),
      0 22px 0 -2px var(--deck-edge),
      0 26px 36px -10px rgba(0,0,0,.6),
      inset 0 3px 0 rgba(255,255,255,.18), inset 0 -14px 30px rgba(0,0,0,.45),
      inset 0 0 0 1px rgba(0,0,0,.28);}
  .deck::after{content:"";position:absolute;inset:14px;border-radius:20px;
    box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.16), inset 0 3px 8px rgba(0,0,0,.24);pointer-events:none;}
  /* wood grain — deeper, layered */
  .wood{position:absolute;inset:0;border-radius:28px;opacity:.22;mix-blend-mode:overlay;pointer-events:none;}
  /* brushed metal strip across the top of the deck */
  .metal-strip{position:absolute;left:6%;right:6%;top:5.2%;height:2.4%;border-radius:6px;
    background:linear-gradient(180deg,#d8cdb4 0%,#9c8e72 40%,#6b5e48 60%,#a89779 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(0,0,0,.4),
      0 1px 0 rgba(0,0,0,.4);}
  .metal-strip::before{content:"";position:absolute;inset:0;border-radius:6px;opacity:.5;
    background:repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 1px,transparent 1px 3px);}

  /* platter well + record */
  .platter{position:absolute;left:4%;top:14%;width:55%;aspect-ratio:1/1;border-radius:50%;
    background:radial-gradient(circle at 50% 42%, #3a3540, #17141d 72%);
    box-shadow:
      inset 0 10px 28px rgba(0,0,0,.78), inset 0 0 0 7px rgba(0,0,0,.32),
      inset 0 0 0 9px var(--platter-rim),
      0 2px 0 3px rgba(255,255,255,.05),
      0 18px 36px rgba(0,0,0,.5);}
  .record{position:absolute;inset:4%;border-radius:50%;
    background:
      repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.06) 0 0.6px, rgba(0,0,0,0) 0.7px 3.2px),
      radial-gradient(circle at 42% 34%, var(--disc-hi), var(--disc) 76%);
    box-shadow:inset 0 0 50px rgba(0,0,0,.9);
    animation:spin 1.8s linear infinite;}
  .record.paused{animation-play-state:paused;}
  .sheen{position:absolute;inset:4%;border-radius:50%;pointer-events:none;z-index:3;
    background:
      radial-gradient(60% 45% at 34% 26%, rgba(255,255,255,.18), rgba(255,255,255,0) 60%),
      radial-gradient(50% 40% at 72% 78%, rgba(120,150,255,.10), rgba(255,255,255,0) 60%);
    mix-blend-mode:screen;}
  .label{position:absolute;left:50%;top:50%;width:47%;aspect-ratio:1/1;border-radius:50%;
    transform:translate(-50%,-50%);overflow:hidden;z-index:2;
    box-shadow:0 0 0 3px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.5), inset 0 0 14px rgba(0,0,0,.35);
    background:#2a2530;}
  .label img{width:100%;height:100%;object-fit:cover;display:block;}
  .label::after{content:"";position:absolute;left:50%;top:50%;width:7%;aspect-ratio:1/1;border-radius:50%;
    transform:translate(-50%,-50%);background:var(--disc);box-shadow:0 0 0 3px rgba(255,255,255,.2);z-index:2;}
  .spindle{position:absolute;left:50%;top:50%;width:2%;aspect-ratio:1/1;border-radius:50%;
    transform:translate(-50%,-50%);background:linear-gradient(180deg,#fff,#b7ab95);z-index:4;box-shadow:0 0 0 2px rgba(0,0,0,.4);}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* tonearm — SVG overlay over the platter */
  .armsvg{position:absolute;left:4%;top:14%;width:55%;aspect-ratio:1/1;z-index:6;overflow:visible;pointer-events:none;}
  #armTube,#armHead{transition:all .6s cubic-bezier(.4,1.3,.5,1);}

  /* ============================================================
     CONSOLE — knobs · 2-row LED · 3-band horizontal EQ
     sits to the right of the platter, on the deck face.
     Three rows (knobs / led / eq) are laid out with a single gap
     so the gap between the led and the eq is visibly larger than
     the gap between the knobs and the led.
     ============================================================ */
  .console{position:absolute;right:4%;top:14%;width:36%;height:14%;
    display:flex;flex-direction:column;gap:8%;}

  /* knobs row — 3 knobs distributed evenly across the LED's width
     (left, center, right). With space-between, 3 items → left/center/right. */
  .knobs{display:flex;align-items:center;justify-content:space-between;
    width:100%;padding:0 0.3%;flex:none;margin-bottom:4%;}
  .knob{width:22%;aspect-ratio:1/1;border-radius:50%;position:relative;
    background:radial-gradient(circle at 38% 30%, #524c58, #16131b 80%);
    box-shadow:inset 0 2px 5px rgba(255,255,255,.22), inset 0 -3px 6px rgba(0,0,0,.6),
      0 10px 18px rgba(0,0,0,.55), 0 2px 0 rgba(0,0,0,.4);}
  .knob::before{content:"";position:absolute;inset:20%;border-radius:50%;
    background:radial-gradient(circle at 40% 34%, #3a3642, #101017);
    box-shadow:inset 0 1px 2px rgba(255,255,255,.15), inset 0 -2px 4px rgba(0,0,0,.6);}
  /* brushed metal ticks around the knob */
  .knob::after{content:"";position:absolute;inset:6%;border-radius:50%;opacity:.7;
    background:repeating-conic-gradient(from 0deg,rgba(0,0,0,.18) 0 1.2deg,transparent 1.2deg 6deg);}
  .knob .ind{position:absolute;left:50%;top:14%;width:7%;height:30%;border-radius:99px;
    transform:translateX(-50%);background:var(--accent);z-index:3;
    box-shadow:0 0 8px rgba(255,180,84,.7), inset 0 1px 0 rgba(255,255,255,.4);}
  .knob.b .ind{background:var(--cream);box-shadow:none;}
  .knob.c .ind{background:var(--accent-2);
    box-shadow:0 0 8px rgba(255,109,143,.7), inset 0 1px 0 rgba(255,255,255,.4);}

  /* ----- 2-row LED display — separate row, vertically centered between knobs
     and the EQ slider. The console (knobs) sits at top:14% with height:14%
     (ends at ~28% of deck). The EQ starts at 74% of deck (bottom:8%, height:18%).
     The midpoint of that gap is ~51%, so the LED is placed with top:42% and
     height:18% to land centered. */
  .display-wrap{position:absolute;right:4%;top:42%;width:36%;height:18%;
    padding:3px;border-radius:16px;
    background:linear-gradient(180deg,#2a1d18,#110a08);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 2px 0 rgba(0,0,0,.4);}
  .display{position:relative;height:100%;border-radius:14px;padding:6% 8%;
    display:flex;flex-direction:column;justify-content:center;gap:6%;overflow:hidden;
    background:
      radial-gradient(120% 100% at 50% 0%, #1a1418, var(--panel) 70%);
    box-shadow:
      inset 0 4px 12px rgba(0,0,0,.95), inset 0 0 0 1px rgba(0,0,0,.7),
      inset 0 -2px 6px rgba(255,255,255,.04),
      0 1px 0 rgba(255,255,255,.06),
      0 0 0 2px rgba(0,0,0,.35);}

  .led{position:relative;overflow:hidden;white-space:nowrap;height:1.3em;line-height:1.3em;
    font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
    font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--led);
    text-shadow:0 0 calc(var(--dot)*1.6) var(--led-glow);
    -webkit-mask-image:radial-gradient(circle at center, #000 0 46%, transparent 52%);
            mask-image:radial-gradient(circle at center, #000 0 46%, transparent 52%);
    -webkit-mask-size:var(--dot) var(--dot); mask-size:var(--dot) var(--dot);
    -webkit-mask-position:center; mask-position:center;}
  .led .txt{display:inline-block;will-change:transform;padding-right:2em;}
  /* Marquee: always running, even when text fits. For short text the shift is
     0 so the animation is visually a no-op; for long text it scrolls the
     full overflow plus a small gap, with a hold at the start, a slow glide,
     and a hold at the end before looping. */
  .led .txt{animation:marquee 11s linear infinite;}
  @keyframes marquee{
    0%, 8%   { transform:translateX(0); }
    92%,100% { transform:translateX(var(--shift,0)); }
  }
  .led.t1{font-size:1.25vw;height:1.3em;}
  .led.t2{font-size:0.9vw;opacity:.92;}
  /* faint "off" pixels behind */
  .display::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
    background:radial-gradient(circle at center, var(--led-off) 0 30%, transparent 34%);
    background-size:var(--dot) var(--dot);}
  /* glass cover: specular sheen */
  .display::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:14px;
    background:
      linear-gradient(160deg, rgba(255,255,255,.12), rgba(255,255,255,0) 42%),
      linear-gradient(0deg, rgba(0,0,0,.18), rgba(0,0,0,0) 30%);
    box-shadow:inset 0 0 24px rgba(0,0,0,.55);}

  /* ----- 3-band equalizer: HORIZONTAL slot faders, RIGHT COLUMN -----
     The EQ is a separate row at the bottom of the right column (where the
     console lives), spanning from the vinyl/platter's right border to the
     deck's right border. The left edge of the EQ aligns with the vinyl's
     right edge, so the LED (above) sits centered between the vinyl (to
     its left) and the deck's right edge — with proper lateral breathing
     room. */
  .eq-wrap{position:absolute;left:62%;right:4%;bottom:8%;height:18%;
    display:flex;align-items:stretch;justify-content:stretch;}
  .eq{position:relative;width:100%;height:100%;
    display:flex;flex-direction:column;justify-content:space-between;gap:10%;}
  .eq-row{position:relative;flex:1;}
  /* the recessed slot — thin, horizontal, full EQ row width */
  .eq-slot{position:absolute;left:0;right:0;top:50%;height:18%;
    transform:translateY(-50%);border-radius:99px;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.45) 0 1px, transparent 1px 3px),
      linear-gradient(90deg,#07050a 0%,#1a131a 50%,#07050a 100%);
    box-shadow:inset 0 2px 4px rgba(0,0,0,.95), inset 0 0 0 1px rgba(0,0,0,.9),
      0 0 0 1px rgba(255,255,255,.04);}
  /* narrow cap (a small slider button).
     width ≈ 11% of the EQ row, height 90% of the band.
     Travel range: left 0%..(100-11)% = 0..89%. */
  .eq-cap{position:absolute;top:50%;width:11%;height:90%;
    transform:translateY(-50%);border-radius:4px;z-index:2;
    background:
      linear-gradient(180deg,#f5efe2 0%,#d6cab2 45%,#a99c86 100%);
    box-shadow:
      0 4px 7px rgba(0,0,0,.7),
      inset 0 1px 0 rgba(255,255,255,.6),
      inset 0 -1px 0 rgba(0,0,0,.25),
      0 0 0 1px rgba(0,0,0,.35);}
  .eq-cap::after{content:"";position:absolute;top:14%;bottom:14%;left:50%;width:2px;
    transform:translateX(-50%);background:var(--accent-2);
    box-shadow:0 0 6px var(--accent-2);border-radius:99px;}

  /* ============================================================
     SIDE TEXT — title, artist, album
     lives OUTSIDE the deck, to the right
     ============================================================ */
  .side{position:relative;flex:1;height:70%;display:flex;flex-direction:column;justify-content:center;
    padding-right:1vw;}
  .side .lead{font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
    font-size:0.9vw;letter-spacing:.42em;color:var(--accent);text-transform:uppercase;
    text-shadow:0 0 14px var(--led-glow);font-weight:700;margin-bottom:1.2vw;}
  .side .lead .dot{display:inline-block;width:.7em;height:.7em;border-radius:50%;
    background:var(--accent-2);box-shadow:0 0 12px var(--accent-2);
    margin-right:.6em;vertical-align:middle;animation:blip 1.6s ease-out infinite;}
  .side .lead .dot.paused{background:#5a5560;box-shadow:none;animation:none;}
  @keyframes blip{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}
  .side .title{font-size:4.4vw;line-height:.96;font-weight:800;letter-spacing:-.02em;
    color:var(--cream);margin:0 0 1vw;text-shadow:0 4px 24px rgba(0,0,0,.6);
    font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;}
  .side .meta{display:flex;align-items:baseline;gap:.8em;
    font-size:1.6vw;font-weight:600;color:#cfc6b6;letter-spacing:.01em;
    text-shadow:0 2px 12px rgba(0,0,0,.5);}
  .side .meta .sep{color:var(--accent);opacity:.8;}
  .side .meta .album{color:#8c8273;font-weight:500;font-style:italic;}
  /* thin glowing underline under the side text */
  .side .rule{height:2px;width:6vw;margin-top:1.4vw;border-radius:2px;
    background:linear-gradient(90deg,var(--accent),transparent);
    box-shadow:0 0 12px var(--led-glow);}

  #stage::after{content:"";position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 240px 70px rgba(0,0,0,.5);}
</style>
</head>
<body>
<div id="stage">
  <div class="glow a"></div><div class="glow b"></div>
  <div class="stage-row">
    <!-- DECK -->
    <div class="deck">
      <svg class="wood" viewBox="0 0 100 78" preserveAspectRatio="none">
        <filter id="woodgrain"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.09" numOctaves="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
        <rect width="100" height="78" filter="url(#woodgrain)"/>
      </svg>
      <div class="metal-strip"></div>
      <div class="platter">
        <div class="record" id="record"><div class="label"><img id="art" alt=""></div></div>
        <div class="sheen"></div>
        <div class="spindle"></div>
      </div>
      <svg class="armsvg" viewBox="0 0 100 100">
        <defs>
          <linearGradient id="tubeG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf6ea"/><stop offset="1" stop-color="#b6aa93"/></linearGradient>
          <radialGradient id="pivotG" cx="0.4" cy="0.34" r="0.75"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e9e2d4"/><stop offset="1" stop-color="#8f836d"/></radialGradient>
          <filter id="armShadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.1" flood-color="#000" flood-opacity="0.45"/></filter>
        </defs>
        <g filter="url(#armShadow)">
          <line id="armCounter" x1="82" y1="15" x2="90" y2="9" stroke="url(#tubeG)" stroke-width="3.6" stroke-linecap="round"/>
          <circle cx="91.5" cy="8" r="3.4" fill="url(#pivotG)"/>
          <line id="armTube" x1="82" y1="15" x2="63" y2="40" stroke="url(#tubeG)" stroke-width="2.8" stroke-linecap="round"/>
          <circle id="armHead" cx="63" cy="40" r="3" fill="#1b1720" stroke="#4a4552" stroke-width="0.7"/>
          <circle cx="82" cy="15" r="5" fill="url(#pivotG)"/>
          <circle cx="82" cy="15" r="1.5" fill="#6f6350"/>
        </g>
      </svg>
      <div class="console">
        <div class="knobs">
          <div class="knob a"><span class="ind"></span></div>
          <div class="knob c"><span class="ind"></span></div>
          <div class="knob b"><span class="ind"></span></div>
        </div>
      </div>
      <div class="display-wrap">
        <div class="display">
          <div class="led t1" id="l-title"><span class="txt">—</span></div>
          <div class="led t2" id="l-artist"><span class="txt"></span></div>
        </div>
      </div>
      <div class="eq-wrap">
        <div class="eq">
          <div class="eq-row"><div class="eq-slot"></div><div class="eq-cap" id="eq1" style="left:22%"></div></div>
          <div class="eq-row"><div class="eq-slot"></div><div class="eq-cap" id="eq2" style="left:47%"></div></div>
          <div class="eq-row"><div class="eq-slot"></div><div class="eq-cap" id="eq3" style="left:72%"></div></div>
        </div>
      </div>
    </div>

    <!-- SIDE TEXT — out of the deck, hanging in space -->
    <div class="side">
      <div class="lead"><span class="dot" id="dot"></span>STREAMING</div>
      <h1 class="title" id="s-title">—</h1>
      <div class="meta">
        <span class="artist" id="s-artist">—</span>
        <span class="sep">·</span>
        <span class="album" id="s-album">—</span>
      </div>
      <div class="rule"></div>
    </div>
  </div>
</div>

<script>
/* Now Playing — Vinyl (cartoon premium) · Primo Engine web wallpaper
   nowPlaying contract: {title,artist,album,artwork(dataURI),isPlaying,position,duration}
   config: bgTop,bgBottom,deck,disc (colors) */
const el = id => document.getElementById(id);

/* stylus lands on the real groove: intersection of arm-circle (pivot,L) and groove-circle (center,r) */
function stylusPoint(r){
  const P={x:82,y:15}, C={x:50,y:50}, L=45;
  const d=Math.hypot(P.x-C.x,P.y-C.y);
  const a=(r*r - L*L + d*d)/(2*d);
  const h=Math.sqrt(Math.max(0,r*r - a*a));
  const ux=(P.x-C.x)/d, uy=(P.y-C.y)/d;
  const mx=C.x+a*ux, my=C.y+a*uy;
  const s1={x:mx+h*uy, y:my-h*ux}, s2={x:mx-h*uy, y:my+h*ux};
  return (s1.x<s2.x)?s1:s2;               // the record (left) side
}
function setArm(progress, playing){
  const p=Math.max(0,Math.min(1,progress||0));
  let r = 37 - (37-19)*p;
  if(!playing) r += 3;
  const S=stylusPoint(r);
  el('armTube').setAttribute('x2',S.x.toFixed(2)); el('armTube').setAttribute('y2',S.y.toFixed(2));
  el('armHead').setAttribute('cx',S.x.toFixed(2)); el('armHead').setAttribute('cy',S.y.toFixed(2));
}

/* LED line: set text, then measure overflow so the marquee animation knows
   how far to translate. The animation always runs (it pauses visually when
   the overflow is 0, since translateX(0) = translateX(0)). The --shift
   variable is only touched when the value actually changes — re-setting a
   CSS custom property on an animating element restarts the animation, which
   causes the marquee to blink. */
const _lineCache = new Map();  // lineId -> last {text, shift}
function setLine(lineId, text){
  const line = el(lineId), span = line.firstElementChild;
  const newText = text || '';
  if (_lineCache.get(lineId)?.text === newText) return;   // no change → skip
  span.textContent = newText;
  _lineCache.set(lineId, { text: newText, shift: null });
  // measure after layout settles, then only update --shift if it changed
  requestAnimationFrame(() => {
    const over = span.scrollWidth - line.clientWidth;
    const newShift = (-over - 8) + 'px';
    if (_lineCache.get(lineId)?.shift !== newShift) {
      span.style.setProperty('--shift', newShift);
      _lineCache.set(lineId, { text: newText, shift: newShift });
    }
  });
}

/* EQ — 3 horizontal faders on tracks that match the LED display's full width.
   The caps are LOCKED in place: low at 18% of the slot, mid at 50%, high at
   82%. They don't move — `setEq` is a no-op kept so the call site doesn't
   need to change, and the cap positions are set once in CSS. */
function setEq(/* progress */){
  // no-op: caps are static. Initial positions are set in the HTML style attrs.
}

let live=false;
function render(np){
  // side text
  el('s-title').textContent  = np.title  || '—';
  el('s-artist').textContent = np.artist || '—';
  el('s-album').textContent  = np.album  || '—';
  // deck LED
  setLine('l-title',  np.title  || '—');
  setLine('l-artist', (np.artist ? np.artist + (np.album ? '  ·  ' + np.album : '') : ''));
  // art
  if (np.artwork) el('art').src = np.artwork;
  // state
  const playing = np.isPlaying !== false;
  el('record').classList.toggle('paused', !playing);
  el('dot').classList.toggle('paused', !playing);
  const dur=np.duration||0, pos=Math.min(np.position||0, dur||1e9);
  const progress = dur ? pos/dur : 0;
  setArm(progress, playing);
  setEq(progress);
}

function shade(hex,f){const n=parseInt((hex||'').replace('#',''),16);if(isNaN(n))return hex;
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;r=Math.min(255,r*f)|0;g=Math.min(255,g*f)|0;b=Math.min(255,b*f)|0;
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');}
function applyConfig(c){if(!c)return;const r=document.documentElement.style;
  if(c.bgTop)r.setProperty('--bg-top',c.bgTop); if(c.bgBottom)r.setProperty('--bg-bot',c.bgBottom);
  if(c.deck){r.setProperty('--deck',c.deck);r.setProperty('--deck-dark',shade(c.deck,.6));r.setProperty('--deck-hi',shade(c.deck,1.28));}
  if(c.disc){r.setProperty('--disc',c.disc);r.setProperty('--disc-hi',shade(c.disc,1.8));}}
window.LiveWallpaper = window.LiveWallpaper || {};
applyConfig(window.LiveWallpaper.config);
window.LiveWallpaper.onConfig = applyConfig;
window.LiveWallpaper.onNowPlaying = np => { live=true; render(np); };
if (window.LiveWallpaper.nowPlaying) window.LiveWallpaper.onNowPlaying(window.LiveWallpaper.nowPlaying);

/* DEMO feed — richer procedural covers so it reads standalone */
function cover(c1,c2){const s=300,cv=document.createElement('canvas');cv.width=cv.height=s;const x=cv.getContext('2d');
  const g=x.createLinearGradient(0,0,s,s);g.addColorStop(0,c1);g.addColorStop(1,c2);x.fillStyle=g;x.fillRect(0,0,s,s);
  x.globalAlpha=.5;x.fillStyle=c1;x.beginPath();x.arc(s*.7,s*.34,s*.34,0,7);x.fill();
  x.globalAlpha=.35;x.fillStyle='#fff';x.beginPath();x.arc(s*.3,s*.72,s*.20,0,7);x.fill();
  x.globalAlpha=.9;x.fillStyle='rgba(0,0,0,.25)';x.fillRect(0,s*.72,s,s*.28);return cv.toDataURL('image/png');}
const demo=[
  {title:"Sleep Like a Baby Tonight",artist:"U2",album:"Songs of Innocence",duration:227,artwork:cover('#ff6d8f','#7a3bff')},
  {title:"Midnight City",artist:"M83",album:"Hurry Up, We're Dreaming",duration:244,artwork:cover('#ffb454','#ff3b6d')},
  {title:"Nightcall",artist:"Kavinsky",album:"OutRun",duration:258,artwork:cover('#2bd1ff','#1b2a6b')},
];
let di=0,pos=0;
function tick(){if(live)return;const t=demo[di];pos+=1;if(pos>t.duration){di=(di+1)%demo.length;pos=0;}render({...t,isPlaying:true,position:pos});}
render({...demo[0],isPlaying:true,position:0});
setInterval(tick,1000);
</script>
