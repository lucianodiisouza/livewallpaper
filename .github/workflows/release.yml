name: Release (unsigned)

# Phase A distribution (docs/DISTRIBUTION.md): build the .app on a tag push,
# package it as a drag-to-Applications .dmg, and publish a GitHub Release. Builds are ad-hoc only — NOT
# Developer ID signed or notarized (that is Phase B, gated on an Apple account),
# so testers must clear Gatekeeper on first launch (see the generated notes).

on:
  push:
    tags:
      - "v*"          # e.g. v0.1.0  → release 0.1.0
  workflow_dispatch:  # manual dry-run: builds + uploads a prerelease you can delete
    inputs:
      version:
        description: "Version to build (no leading v). Defaults to 0.0.0-dev."
        required: false
        default: "0.0.0-dev"

permissions:
  contents: write     # required for gh release create / upload

jobs:
  build:
    runs-on: macos-26   # needs the macOS 26 SDK + Swift 6.2 toolchain (Package.swift)
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      - name: Install ffmpeg (bakes the default video wallpaper into the bundle)
        run: brew install ffmpeg

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"          # strip leading v from the tag
          else
            V="${{ github.event.inputs.version }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building version: $V"

      - name: Build app bundle (Release, sandboxed, ad-hoc signed)
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: scripts/build-app.sh

      - name: Run headless self-test
        run: '"dist/Primo Engine.app/Contents/MacOS/LiveWallpaper" --selftest'

      - name: Package .dmg artifact
        id: pkg
        run: |
          V="${{ steps.ver.outputs.version }}"
          DMG="PrimoEngine-${V}.dmg"
          # Stage the app + a symlink to /Applications so the DMG opens to a drag-and-drop installer.
          STAGE="$(mktemp -d)/dmgroot"
          mkdir -p "$STAGE"
          cp -R "dist/Primo Engine.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Primo Engine" -srcfolder "$STAGE" -ov -format UDZO "dist/${DMG}"
          shasum -a 256 "dist/${DMG}" | tee "dist/${DMG}.sha256"
          echo "dmg=dist/${DMG}" >> "$GITHUB_OUTPUT"
          echo "sha=dist/${DMG}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact (for manual runs / debugging)
        uses: actions/upload-artifact@v4
        with:
          name: PrimoEngine-${{ steps.ver.outputs.version }}
          path: |
            ${{ steps.pkg.outputs.dmg }}
            ${{ steps.pkg.outputs.sha }}

      - name: Write release notes
        run: |
          V="${{ steps.ver.outputs.version }}"
          # Extract the matching section from CHANGELOG.md so the GitHub Release carries the
          # curated notes. Matches `## [x.y.z]` until the next `## [` heading or EOF. Empty if
          # the version isn't in the changelog yet (workflow keeps working with template-only).
          CHANGELOG_SECTION="$(awk -v v="[${V}]" '
            /^## \[Unreleased\]/ { next }
            /^## \[/ && index($0, v) { in_section = 1; next }
            /^## \[/ && in_section { exit }
            /^\[.*\]:/ && in_section { exit }
            in_section { print }
          ' CHANGELOG.md)"
          {
            echo "## Primo Engine ${V} (unsigned test build)"
            echo
            echo "A power-aware live-wallpaper engine for macOS. This is an **unsigned**"
            echo "build for testers — it is not yet notarized by Apple, so macOS"
            echo "Gatekeeper will block the first launch. This is expected."
            echo
            if [ -n "${CHANGELOG_SECTION}" ]; then
              echo "### What's changed in ${V}"
              echo
              echo "${CHANGELOG_SECTION}"
              echo
            fi
            echo "### Install"
            echo "1. Download \`PrimoEngine-${V}.dmg\` below and open it."
            echo "2. Drag **Primo Engine** onto the **Applications** shortcut in the window."
            echo "3. **First launch:** open \`/Applications\`, right-click **Primo Engine** → **Open** → **Open** again."
            echo "   (Or: **System Settings → Privacy & Security → Open Anyway**.)"
            echo "4. Look for the 🖼️ icon in the menu bar. Quit from there."
            echo
            echo "Requires **macOS 26** or later."
            echo
            echo "### Verify the download (optional)"
            echo '```'
            echo "shasum -a 256 PrimoEngine-${V}.dmg"
            echo '```'
            echo "Compare against \`PrimoEngine-${V}.dmg.sha256\` attached below."
          } > dist/RELEASE_NOTES.md

      - name: Create GitHub Release
        if: github.event_name == 'push'   # only tag pushes publish a real release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "Primo Engine ${V}" \
            --notes-file dist/RELEASE_NOTES.md \
            "${{ steps.pkg.outputs.dmg }}" \
            "${{ steps.pkg.outputs.sha }}"
