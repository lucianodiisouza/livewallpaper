<!doctype html>
<!--
  heavy-webgl.html — intentionally heavy WebGL2 page for baseline comparison.

  What it does:
    - 5,000 animated particles drawn as POINTS
    - Custom vertex+fragment shader with per-point time animation
    - 4 draw passes per frame (the shader is cheap, the per-frame multi-draw
      mimics a real-world "lots of small draws" pattern)
    - devicePixelRatio-aware canvas (will go 2x or 3x on a Retina display)
    - requestAnimationFrame loop with no sleep — runs as fast as the browser
      will paint

  This is the "what would a wallpaper engine cost you if it used a real
  browser (or Electron, or a Chromium WebView)?" baseline. It is not
  representative of a typical webpage; it is calibrated to be heavy enough
  to show a clear CPU and GPU delta against Primo Engine's WKWebView, which
  has the network/navigation lockdown from WebValidator.swift applied.

  Open it via docs/perf/run-baseline.sh, or just `open` it in any browser.
-->
<html>
<head>
  <meta charset="utf-8">
  <title>Heavy WebGL2 Baseline</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  const c = document.getElementById('c');
  const gl = c.getContext('webgl2') || c.getContext('webgl');
  if (!gl) {
    document.body.innerHTML = '<p style="color:#fff;font:14px sans-serif;padding:20px">WebGL not available in this browser.</p>';
    return;
  }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    c.width  = Math.floor(window.innerWidth  * dpr);
    c.height = Math.floor(window.innerHeight * dpr);
    gl.viewport(0, 0, c.width, c.height);
  }
  resize();
  window.addEventListener('resize', resize);

  const N = 5000;
  const pos = new Float32Array(N * 2);
  for (let i = 0; i < N; i++) {
    pos[i * 2]     = Math.random() * 2 - 1;
    pos[i * 2 + 1] = Math.random() * 2 - 1;
  }

  const vs = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs, `
    attribute vec2 p;
    varying float t;
    uniform float u;
    void main() {
      t = u + atan(p.x, p.y);
      gl_PointSize = 6.0 + 4.0 * sin(t * 3.0);
      gl_Position  = vec4(p, 0.0, 1.0);
    }
  `);
  gl.compileShader(vs);

  const fs = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fs, `
    precision highp float;
    varying float t;
    void main() {
      vec2 d = gl_PointCoord - vec2(0.5);
      float r = length(d);
      if (r > 0.5) discard;
      gl_FragColor = vec4(
        0.5 + 0.5 * sin(t),
        0.3 + 0.5 * cos(t * 1.3),
        0.5 + 0.5 * sin(t * 0.7),
        1.0
      );
    }
  `);
  gl.compileShader(fs);

  const prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, pos, gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const uLoc = gl.getUniformLocation(prog, 'u');

  const t0 = performance.now();
  function frame() {
    const t = (performance.now() - t0) / 1000;
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(uLoc, t);
    for (let i = 0; i < 4; i++) {
      gl.drawArrays(gl.POINTS, 0, N);
    }
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
